version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: haven
    bump: patch

build:
  run_buildscript: false

images:
  - id: haven
    target: service
    service: haven
    source: ghcr.io/havenweb/haven
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat

  - id: postgres
    target: service
    service: haven-pg
    source: docker.1ms.run/library/postgres
    channel: custom
    sort: semver
    tag_regex: '^17\.\d+-alpine3\.\d+$'
    version_regex: '^(?P<version>17\.\d+)-alpine3\.\d+$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: Haven
      source: https://github.com/havenweb/haven
      source_author: havenweb
  private:
    enabled: true
    skip_if_version_exists: true
    name: Haven
    summary: 由 GitHub Actions 自动发布
