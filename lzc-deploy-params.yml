params:
  - id: admin_email
    type: string
    name: "Admin email"
    description: "Email address used for the initial Haven administrator"
    optional: false

  - id: admin_password
    type: secret
    name: "Admin password"
    description: "Password used for the initial Haven administrator"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    admin_email:
      name: "管理员邮箱"
      description: "管理员邮箱"
    admin_password:
      name: "管理员密码"
      description: "管理员密码"
